<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kemonokaki Provenance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky query bar over a dense card grid; sender chips act as one-click filters. */
:root {
  --bg: #f6f3f7;
  --surface: #ffffff;
  --fg: #2a2430;
  --muted: #7a7084;
  --line: #e4dde8;
  --accent: #d0587e;
  --accent-ink: #ffffff;
  --mint: #2f8f78;
  --warn: #b5482f;
  --display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17141b; --surface: #221e28; --fg: #eee8f2; --muted: #a197ab; --line: #352f3d;
    --accent: #ec7aa0; --accent-ink: #1a1016; --mint: #6fd0b5; --warn: #f08a70; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17141b; --surface: #221e28; --fg: #eee8f2; --muted: #a197ab; --line: #352f3d;
  --accent: #ec7aa0; --accent-ink: #1a1016; --mint: #6fd0b5; --warn: #f08a70; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 500 15px/1.5 var(--display);
  padding-inline: 16px; padding-block: 0 48px;
}
.wrap { max-width: 1180px; margin: 0 auto; }
header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; padding-block: 28px 18px; }
h1 { margin: 0; font-weight: 900; font-size: clamp(26px, 4vw, 36px); letter-spacing: -0.01em; text-wrap: balance; }
h1 span { color: var(--accent); }
.meta { font: 400 12px/1.4 var(--mono); color: var(--muted); }
.meta a { color: inherit; }

form {
  position: sticky; top: 0; z-index: 5;
  display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end;
  background: var(--bg); padding-block: 12px; border-bottom: 1px solid var(--line);
}
label { display: grid; gap: 4px; min-width: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
input {
  width: 100%; min-width: 0; font: 400 14px var(--mono); color: var(--fg);
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
}
input:focus-visible, button:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[aria-invalid="true"] { border-color: var(--warn); }
button {
  font: 700 14px var(--display); cursor: pointer; border: 0; border-radius: 10px;
  padding: 11px 20px; background: var(--accent); color: var(--accent-ink);
}
button:disabled { opacity: 0.55; cursor: progress; }
@media (max-width: 720px) { form { grid-template-columns: 1fr; } }

.status { min-height: 22px; padding-block: 14px 4px; font: 400 13px var(--mono); color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap; }
.status strong { color: var(--fg); font-weight: 500; }
.status .err { color: var(--warn); }

.senders { display: flex; flex-wrap: wrap; gap: 6px; padding-block: 6px 16px; }
.chip {
  font: 400 12px var(--mono); color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; cursor: pointer;
  font-variant-numeric: tabular-nums;
}
.chip b { color: var(--accent); font-weight: 500; margin-left: 6px; }
.chip[aria-pressed="true"] { border-color: var(--accent); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
@media (max-width: 440px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.card .img { aspect-ratio: 1; max-width: 100%; background: var(--line); }
.card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .body { padding: 10px 12px 12px; display: grid; gap: 6px; min-width: 0; }
.card .name { font-weight: 900; font-size: 16px; display: flex; justify-content: space-between; gap: 8px; }
.card .name a { color: inherit; text-decoration: none; }
.card .name a:hover { color: var(--accent); }
.row { display: grid; gap: 1px; min-width: 0; }
.row .k { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.row .v { font: 400 12px var(--mono); overflow-wrap: anywhere; }
.row .v a { color: var(--fg); }
.row .v a:hover { color: var(--accent); }
.mint { color: var(--mint); }
.empty { padding-block: 40px; text-align: center; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .card { transition: transform .15s; } .card:hover { transform: translateY(-2px); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Kemono<span>kaki</span> Provenance</h1>
    <div class="meta">Base · <a href="https://basescan.org/token/0xee7d1b184be8185adc7052635329152a4d0cdefa" target="_blank" rel="noopener">0xee7d…defa</a></div>
  </header>

  <form id="q" autocomplete="off">
    <label for="owner">Current owner
      <input id="owner" name="owner" placeholder="0x…" spellcheck="false" required>
    </label>
    <label for="prev">Previous owner
      <input id="prev" name="prev" placeholder="0x… (optional)" spellcheck="false">
    </label>
    <button id="go" type="submit">Look up</button>
  </form>

  <div class="status" id="status"></div>
  <div class="senders" id="senders"></div>
  <div class="grid" id="grid"></div>
</div>

<script>
const API = "https://base.blockscout.com/api/v2";
const CONTRACT = "0xee7d1b184be8185adc7052635329152a4d0cdefa";
const ZERO = "0x0000000000000000000000000000000000000000";
const GATEWAYS = ["https://ipfs.io/ipfs/", "https://gateway.pinata.cloud/ipfs/", "https://dweb.link/ipfs/"];
const isAddr = s => /^0x[0-9a-fA-F]{40}$/.test(s);
const short = a => a.slice(0, 6) + "…" + a.slice(-4);
const $ = id => document.getElementById(id);

let state = null; // { owner, tokens: [{id, name, ipfs, image, from, fromEns, time}] }
let runId = 0;

async function getJSON(url, tries = 5) {
  for (let i = 0; i < tries; i++) {
    const r = await fetch(url);
    if (r.ok) return r.json();
    if (r.status === 429 || r.status >= 500) { await new Promise(res => setTimeout(res, 800 * (i + 1))); continue; }
    throw new Error(`Blockscout returned ${r.status}`);
  }
  throw new Error("Blockscout is rate-limiting requests. Try again in a minute.");
}

// Follows Blockscout's keyset pagination until exhausted.
async function paginate(path, params, onPage) {
  let next = null;
  do {
    const q = new URLSearchParams({ ...params, ...(next || {}) });
    const d = await getJSON(`${API}${path}?${q}`);
    onPage(d.items || []);
    next = d.next_page_params;
  } while (next);
}

async function load(owner) {
  const id = ++runId;
  const held = new Map();
  const lastIn = new Map();
  let pages = 0;
  const tick = () => { if (id === runId) setStatus(`Loading… ${held.size} held · ${lastIn.size} incoming transfers · ${++pages} pages`); };

  await Promise.all([
    paginate(`/tokens/${CONTRACT}/instances`, { holder_address_hash: owner }, items => {
      for (const t of items) held.set(t.id, t);
      tick();
    }),
    // Newest first, so the first transfer seen per token is the one that delivered it to the current owner.
    paginate(`/addresses/${owner}/token-transfers`, { type: "ERC-721", filter: "to", token: CONTRACT }, items => {
      for (const t of items) {
        const tid = t.total?.token_id;
        if (tid != null && !lastIn.has(tid)) lastIn.set(tid, t);
      }
      tick();
    }),
  ]);
  if (id !== runId) return null;

  const tokens = [...held.values()].map(t => {
    const tx = lastIn.get(t.id);
    const media = t.media_url || t.metadata?.image || "";
    return {
      id: t.id,
      name: t.metadata?.name || `Kemonokaki #${t.id}`,
      ipfs: media.startsWith("ipfs://") ? media.slice(7) : null,
      image: t.image_url || media,
      from: tx ? tx.from.hash : null,
      fromEns: tx ? tx.from.ens_domain_name : null,
      time: tx ? tx.timestamp : null,
      tx: tx ? tx.transaction_hash : null,
    };
  });
  tokens.sort((a, b) => (b.time || "").localeCompare(a.time || "") || Number(a.id) - Number(b.id));
  return { owner, tokens };
}

function setStatus(html, isErr) {
  $("status").innerHTML = isErr ? `<span class="err">${html}</span>` : html;
}

function imgSrcs(t) {
  const list = t.ipfs ? GATEWAYS.map(g => g + t.ipfs) : [];
  if (t.image && !list.includes(t.image)) list.push(t.image);
  return list;
}

function render() {
  const grid = $("grid"), senders = $("senders");
  grid.innerHTML = ""; senders.innerHTML = "";
  if (!state) return;
  const prev = $("prev").value.trim().toLowerCase();
  const shown = prev ? state.tokens.filter(t => (t.from || "").toLowerCase() === prev) : state.tokens;

  const counts = new Map();
  for (const t of state.tokens) {
    const k = t.from || "unknown";
    const c = counts.get(k) || { n: 0, ens: t.fromEns };
    c.n++; counts.set(k, c);
  }
  [...counts.entries()].sort((a, b) => b[1].n - a[1].n).slice(0, 40).forEach(([addr, c]) => {
    if (addr === "unknown") return;
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip";
    b.setAttribute("aria-pressed", String(addr.toLowerCase() === prev));
    b.innerHTML = `${addr === ZERO ? "Minted" : (c.ens || short(addr))}<b>${c.n}</b>`;
    b.title = addr;
    b.onclick = () => {
      $("prev").value = addr.toLowerCase() === prev ? "" : addr;
      syncUrl(); render();
    };
    senders.append(b);
  });

  setStatus(`<strong>${shown.length}</strong>&nbsp;shown · ${state.tokens.length} held by ${short(state.owner)} · ${counts.size} previous owners`);
  if (!shown.length) { grid.innerHTML = `<div class="empty">No matches</div>`; return; }

  const frag = document.createDocumentFragment();
  for (const t of shown) {
    const card = document.createElement("article");
    card.className = "card";
    const srcs = imgSrcs(t);
    const from = !t.from ? `<span>unknown</span>`
      : t.from === ZERO ? `<span class="mint">Minted</span>`
      : `<a href="https://basescan.org/address/${t.from}" target="_blank" rel="noopener" title="${t.from}">${t.fromEns || short(t.from)}</a>`;
    const when = t.time ? new Date(t.time).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) : "—";
    card.innerHTML = `
      <div class="img"><img loading="lazy" alt="${t.name}"></div>
      <div class="body">
        <div class="name"><a href="https://opensea.io/item/base/${CONTRACT}/${t.id}" target="_blank" rel="noopener">#${t.id}</a></div>
        <div class="row"><span class="k">Previous owner</span><span class="v">${from}</span></div>
        <div class="row"><span class="k">Received</span><span class="v">${t.tx ? `<a href="https://basescan.org/tx/${t.tx}" target="_blank" rel="noopener">${when}</a>` : when}</span></div>
      </div>`;
    const img = card.querySelector("img");
    let i = 0;
    img.onerror = () => { if (++i < srcs.length) img.src = srcs[i]; };
    if (srcs.length) img.src = srcs[0];
    frag.append(card);
  }
  grid.append(frag);
}

function syncUrl() {
  const p = new URLSearchParams();
  const o = $("owner").value.trim(), v = $("prev").value.trim();
  if (o) p.set("owner", o);
  if (v) p.set("prev", v);
  history.replaceState(null, "", p.toString() ? `?${p}` : location.pathname);
}

async function run() {
  const owner = $("owner").value.trim();
  const prev = $("prev").value.trim();
  $("owner").setAttribute("aria-invalid", String(!isAddr(owner)));
  $("prev").setAttribute("aria-invalid", String(!!prev && !isAddr(prev)));
  if (!isAddr(owner)) return setStatus("Current owner must be a 0x address (42 characters).", true);
  if (prev && !isAddr(prev)) return setStatus("Previous owner must be a 0x address (42 characters).", true);
  syncUrl();

  if (state && state.owner.toLowerCase() === owner.toLowerCase()) return render();
  state = null; render();
  $("go").disabled = true;
  try {
    const s = await load(owner);
    if (s) { state = s; render(); }
  } catch (e) {
    setStatus(`${e.message}`, true);
  } finally {
    $("go").disabled = false;
  }
}

$("q").addEventListener("submit", e => { e.preventDefault(); run(); });
$("prev").addEventListener("input", () => {
  const v = $("prev").value.trim();
  if (state && (!v || isAddr(v))) { $("prev").setAttribute("aria-invalid", "false"); syncUrl(); render(); }
});

const params = new URLSearchParams(location.search);
$("owner").value = params.get("owner") || "";
$("prev").value = params.get("prev") || "";
if ($("owner").value) run();
</script>
</body>
</html>
