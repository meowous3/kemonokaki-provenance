<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kemonokaki Provenance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky query bar over a dense card grid; sender chips act as one-click filters. */
:root {
  --bg: #f6f3f7;
  --surface: #ffffff;
  --fg: #2a2430;
  --muted: #7a7084;
  --line: #e4dde8;
  --accent: #d0587e;
  --accent-ink: #ffffff;
  --mint: #2f8f78;
  --warn: #b5482f;
  --display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17141b; --surface: #221e28; --fg: #eee8f2; --muted: #a197ab; --line: #352f3d;
    --accent: #ec7aa0; --accent-ink: #1a1016; --mint: #6fd0b5; --warn: #f08a70; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17141b; --surface: #221e28; --fg: #eee8f2; --muted: #a197ab; --line: #352f3d;
  --accent: #ec7aa0; --accent-ink: #1a1016; --mint: #6fd0b5; --warn: #f08a70; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 500 15px/1.5 var(--display);
  padding-inline: 16px; padding-block: 0 48px;
}
.wrap { max-width: 1180px; margin: 0 auto; }
header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; padding-block: 28px 18px; }
h1 { margin: 0; font-weight: 900; font-size: clamp(26px, 4vw, 36px); letter-spacing: -0.01em; text-wrap: balance; }
h1 span { color: var(--accent); }
.meta { font: 400 12px/1.4 var(--mono); color: var(--muted); }
.meta a { color: inherit; }

#q {
  position: sticky; top: 0; z-index: 5;
  display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end;
  background: var(--bg); padding-block: 12px; border-bottom: 1px solid var(--line);
}
label { display: grid; gap: 4px; min-width: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
input {
  width: 100%; min-width: 0; font: 400 14px var(--mono); color: var(--fg);
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
}
input:focus-visible, button:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[aria-invalid="true"] { border-color: var(--warn); }
button {
  font: 700 14px var(--display); cursor: pointer; border: 0; border-radius: 10px;
  padding: 11px 20px; background: var(--accent); color: var(--accent-ink);
}
button:disabled { opacity: 0.55; cursor: progress; }
@media (max-width: 720px) { #q { grid-template-columns: 1fr; } }
.field { display: grid; gap: 4px; min-width: 0; }
.field > .lbl { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
#owners { display: grid; gap: 6px; }
.owner-row { display: flex; gap: 6px; min-width: 0; }
.owner-row input { flex: 1 1 auto; }
.icon { background: var(--surface); color: var(--muted); border: 1px solid var(--line); padding: 0 12px; font-size: 18px; line-height: 1; }
.icon:hover { color: var(--fg); }

.status { min-height: 22px; padding-block: 14px 4px; font: 400 13px var(--mono); color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap; }
.status strong { color: var(--fg); font-weight: 500; }
.status .err { color: var(--warn); }

.skip { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding-block: 10px; border-bottom: 1px solid var(--line); }
.skip .k { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.skip .chip { cursor: default; display: inline-flex; align-items: center; gap: 6px; overflow-wrap: anywhere; }
.skip .chip a { color: var(--fg); }
.skip .chip a:hover { color: var(--accent); }
.skip .chip button { background: none; color: var(--muted); padding: 0 2px; font: 700 14px/1 var(--display); border-radius: 4px; }
.skip .chip button:hover { color: var(--warn); }
.skip input { width: 25em; max-width: 100%; padding: 5px 10px; font-size: 12px; border-radius: 999px; }
.skip .small { padding: 5px 12px; font-size: 12px; border-radius: 999px; }
.skip .ghost { background: var(--surface); color: var(--muted); border: 1px solid var(--line); }
.senders { display: flex; flex-wrap: wrap; gap: 6px; padding-block: 6px 16px; }
.chip {
  font: 400 12px var(--mono); color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; cursor: pointer;
  font-variant-numeric: tabular-nums;
}
.chip b { color: var(--accent); font-weight: 500; margin-left: 6px; }
.chip[aria-pressed="true"] { border-color: var(--accent); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
@media (max-width: 440px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.card .img { aspect-ratio: 1; max-width: 100%; background: var(--line); }
.card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .body { padding: 10px 12px 12px; display: grid; gap: 6px; min-width: 0; }
.card .name { font-weight: 900; font-size: 16px; display: flex; justify-content: space-between; gap: 8px; }
.card .name a { color: inherit; text-decoration: none; }
.card .name a:hover { color: var(--accent); }
.row { display: grid; gap: 1px; min-width: 0; }
.row .k { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.row .v { font: 400 12px var(--mono); overflow-wrap: anywhere; }
.row .v a { color: var(--fg); }
.row .v a:hover { color: var(--accent); }
.mint { color: var(--mint); }
.empty { padding-block: 40px; text-align: center; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .card { transition: transform .15s; } .card:hover { transform: translateY(-2px); } }

.bar { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.bar .status { flex: 1 1 auto; min-width: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-block: 12px 0; }
.seg button { background: var(--surface); color: var(--muted); border-radius: 0; padding: 6px 14px; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
table { width: 100%; border-collapse: collapse; font: 400 13px var(--mono); font-variant-numeric: tabular-nums; }
th { text-align: left; font: 700 10px var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 6px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td a { color: var(--fg); }
td a:hover { color: var(--accent); }
td.thumb { width: 52px; padding-right: 0; }
td.thumb img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; display: block; background: var(--line); }
td.id { font-weight: 500; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Kemono<span>kaki</span> Provenance</h1>
    <div class="meta">Base · <a href="https://basescan.org/token/0xee7d1b184be8185adc7052635329152a4d0cdefa" target="_blank" rel="noopener">0xee7d…defa</a> · <span id="asof"></span></div>
  </header>

  <form id="q" autocomplete="off">
    <div class="field">
      <span class="lbl" id="owners-label">Current owners</span>
      <div id="owners" role="group" aria-labelledby="owners-label"></div>
    </div>
    <label for="prev">Previous owner
      <input id="prev" name="prev" placeholder="0x… (optional)" spellcheck="false">
    </label>
    <button id="go" type="submit">Look up</button>
  </form>

  <form class="skip" id="skip" autocomplete="off">
    <span class="k">Skip</span>
    <span id="skip-list" style="display:contents"></span>
    <input id="skip-add" placeholder="0x…" spellcheck="false" aria-label="Address to skip">
    <button class="small" type="submit">Add</button>
    <button class="small ghost" type="button" id="skip-reset">Reset</button>
  </form>

  <div class="bar">
    <div class="status" id="status"></div>
    <div class="seg" role="group" aria-label="View">
      <button type="button" id="view-grid" aria-pressed="true">Grid</button>
      <button type="button" id="view-list" aria-pressed="false">List</button>
    </div>
  </div>
  <div class="senders" id="senders"></div>
  <div id="results"></div>
</div>

<script>
const CONTRACT = "0xee7d1b184be8185adc7052635329152a4d0cdefa";
const ZERO = "0x0000000000000000000000000000000000000000";
const IMAGE_CID = "bafybeidxclt74frtmiuiisfquphn2qdukz2cg63cr7bwyblp3mfwr5gk6a";
const GATEWAY = "https://ipfs.filebase.io/ipfs/";
const isAddr = s => /^0x[0-9a-fA-F]{40}$/.test(s);
const short = a => a.slice(0, 6) + "…" + a.slice(-4);
const lc = s => (s || "").toLowerCase();
const $ = id => document.getElementById(id);
// Wallets that only pass NFTs along; stepped over like contracts when finding the previous owner.
const DEFAULT_SKIP = [
  "0xc49c946586b1c686a8ea5bb423b81a5efcd51ffc",
  "0xe4ea4abf707118abf2269badec1950abeffd6907",
];
let skip = new Set(DEFAULT_SKIP);
try { const s = JSON.parse(localStorage.getItem("skip")); if (Array.isArray(s)) skip = new Set(s.filter(isAddr).map(lc)); } catch {}
const nftUrl = id => `https://basescan.org/nft/${CONTRACT}/${id}`;
const addrUrl = a => `https://basescan.org/address/${a}`;

let state = null; // { owners, tokens: [{id, name, owner, from, time, tx}] }
let view = "grid";
try { if (localStorage.getItem("view") === "list") view = "list"; } catch {}

// data/transfers.json is produced by scripts/update.mjs: the last 7 days of Transfer logs
// as [block, logIndex, tokenId, from, to, txHash], oldest first, plus address kinds.
let dataPromise = null;
function loadData() {
  if (!dataPromise) {
    dataPromise = fetch(`data/transfers.json?t=${Date.now()}`)
      .then(r => { if (!r.ok) throw new Error(`Couldn't load transfer data (${r.status}).`); return r.json(); })
      .then(d => {
        const rows = d.logs.map(([block, li, id, from, to, hash]) => ({ block, li, id, from, to, hash, time: d.toTime - 2 * (d.toBlock - block) }));
        rows.reverse(); // newest first
        return { rows, kinds: d.kinds, toTime: d.toTime };
      })
      .catch(e => { dataPromise = null; throw e; });
  }
  return dataPromise;
}

const before = (a, b) => a.block < b.block || (a.block === b.block && a.li < b.li);

function compute(owner, { rows, kinds }) {
  const me = lc(owner);
  const passThrough = a => kinds[a] === "c" || skip.has(a);

  // The newest transfer per token decides who holds it.
  const seen = new Set();
  const tokens = [];
  for (const r of rows) {
    if (seen.has(r.id)) continue;
    seen.add(r.id);
    if (r.to !== me) continue;
    let cur = r.from, ref = r;
    // Walk back past contracts, skipped wallets and the owner's own earlier hops to the wallet that sent it.
    for (let hop = 0; hop < 16 && (passThrough(cur) || cur === me); hop++) {
      const prev = rows.find(p => p.id === r.id && p.to === cur && before(p, ref));
      if (!prev) break;
      cur = prev.from;
      ref = prev;
    }
    tokens.push({ id: r.id, name: `Kemonokaki #${r.id}`, owner: me, from: cur, time: r.time, tx: r.hash });
  }
  return tokens;
}

function computeAll(owners, data) {
  const tokens = owners.flatMap(o => compute(o, data));
  tokens.sort((a, b) => b.time - a.time || Number(a.id) - Number(b.id));
  return { owners, tokens };
}

function setStatus(html, isErr) {
  $("status").innerHTML = isErr ? `<span class="err">${html}</span>` : html;
}

function imgSrcs(t) {
  // Mirrored by scripts/update.mjs; the gateway covers anything not mirrored yet.
  return [`images/${t.id}.png`, `images/${t.id}.gif`, `${GATEWAY}${IMAGE_CID}/${t.id}.png`, `${GATEWAY}${IMAGE_CID}/${t.id}.gif`];
}
function attachImg(img, t) {
  const srcs = imgSrcs(t);
  let i = 0;
  img.onerror = () => { if (++i < srcs.length) img.src = srcs[i]; };
  if (srcs.length) img.src = srcs[0];
}

const fromHtml = t => !t.from ? `<span>unknown</span>`
  : t.from === ZERO ? `<span class="mint">Minted</span>`
  : `<a href="${addrUrl(t.from)}" target="_blank" rel="noopener" title="${t.from}">${t.from}</a>`;
const whenHtml = t => {
  const when = t.time ? new Date(t.time * 1000).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) : "—";
  return t.tx ? `<a href="https://basescan.org/tx/${t.tx}" target="_blank" rel="noopener">${when}</a>` : when;
};

function renderGrid(shown, multi) {
  const grid = document.createElement("div");
  grid.className = "grid";
  for (const t of shown) {
    const card = document.createElement("article");
    card.className = "card";
    card.innerHTML = `
      <div class="img"><img loading="lazy" alt="${t.name}"></div>
      <div class="body">
        <div class="name"><a href="${nftUrl(t.id)}" target="_blank" rel="noopener">#${t.id}</a></div>
        ${multi ? `<div class="row"><span class="k">Current owner</span><span class="v"><a href="${addrUrl(t.owner)}" target="_blank" rel="noopener">${t.owner}</a></span></div>` : ""}
        <div class="row"><span class="k">Previous owner</span><span class="v">${fromHtml(t)}</span></div>
        <div class="row"><span class="k">Received</span><span class="v">${whenHtml(t)}</span></div>
      </div>`;
    attachImg(card.querySelector("img"), t);
    grid.append(card);
  }
  return grid;
}

function renderList(shown, multi) {
  const wrap = document.createElement("div");
  wrap.className = "table-wrap";
  wrap.innerHTML = `<table><thead><tr><th></th><th>Token</th>${multi ? "<th>Current owner</th>" : ""}<th>Previous owner</th><th>Received</th><th>BaseScan</th></tr></thead><tbody></tbody></table>`;
  const body = wrap.querySelector("tbody");
  for (const t of shown) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="thumb"><img loading="lazy" alt="${t.name}"></td>
      <td class="id">#${t.id}</td>
      ${multi ? `<td><a href="${addrUrl(t.owner)}" target="_blank" rel="noopener">${t.owner}</a></td>` : ""}
      <td>${fromHtml(t)}</td>
      <td>${whenHtml(t)}</td>
      <td><a href="${nftUrl(t.id)}" target="_blank" rel="noopener">View NFT</a></td>`;
    attachImg(tr.querySelector("img"), t);
    body.append(tr);
  }
  return wrap;
}

function render() {
  const results = $("results"), senders = $("senders");
  results.innerHTML = ""; senders.innerHTML = "";
  if (!state) return;
  const prev = lc($("prev").value.trim());
  const shown = prev ? state.tokens.filter(t => lc(t.from) === prev) : state.tokens;

  const counts = new Map();
  for (const t of state.tokens) {
    if (!t.from) continue;
    const c = counts.get(t.from) || { n: 0 };
    c.n++; counts.set(t.from, c);
  }
  [...counts.entries()].sort((a, b) => b[1].n - a[1].n).slice(0, 40).forEach(([addr, c]) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip";
    b.setAttribute("aria-pressed", String(lc(addr) === prev));
    b.innerHTML = `${addr === ZERO ? "Minted" : addr}<b>${c.n}</b>`;
    b.title = addr;
    b.onclick = () => {
      $("prev").value = lc(addr) === prev ? "" : addr;
      syncUrl(); render();
    };
    senders.append(b);
  });

  setStatus(`<strong>${shown.length}</strong>&nbsp;shown · ${state.tokens.length} received by ${state.owners.length === 1 ? state.owners[0] : `${state.owners.length} wallets`} in 7 days · ${counts.size} previous owner${counts.size === 1 ? "" : "s"}`);
  if (!shown.length) { results.innerHTML = `<div class="empty">No matches</div>`; return; }
  const multi = state.owners.length > 1;
  results.append(view === "list" ? renderList(shown, multi) : renderGrid(shown, multi));
}

function setView(v) {
  view = v;
  $("view-grid").setAttribute("aria-pressed", String(v === "grid"));
  $("view-list").setAttribute("aria-pressed", String(v === "list"));
  try { localStorage.setItem("view", v); } catch {}
  render();
}

function syncUrl() {
  const p = new URLSearchParams();
  const o = ownerInputs().map(i => i.value.trim()).filter(Boolean).join(","), v = $("prev").value.trim();
  if (o) p.set("owner", o);
  if (v) p.set("prev", v);
  history.replaceState(null, "", p.toString() ? `?${p}` : location.pathname);
}

async function run() {
  const inputs = ownerInputs();
  let bad = 0;
  for (const i of inputs) {
    const v = i.value.trim();
    const ok = !v || isAddr(v);
    i.setAttribute("aria-invalid", String(!ok));
    if (!ok) bad++;
  }
  const owners = [...new Set(inputs.map(i => lc(i.value.trim())).filter(isAddr))];
  const prev = $("prev").value.trim();
  $("prev").setAttribute("aria-invalid", String(!!prev && !isAddr(prev)));
  if (bad) return setStatus("Current owners must be 0x addresses (42 characters).", true);
  if (!owners.length) return setStatus("Enter a current owner.", true);
  if (prev && !isAddr(prev)) return setStatus("Previous owner must be a 0x address (42 characters).", true);
  syncUrl();

  if (state && state.owners.join() === owners.join()) return render();
  state = null; render();
  setStatus("Loading…");
  $("go").disabled = true;
  try {
    state = computeAll(owners, await loadData());
    render();
  } catch (e) {
    setStatus(`${e.message}`, true);
  } finally {
    $("go").disabled = false;
  }
}

$("q").addEventListener("submit", e => { e.preventDefault(); run(); });
$("prev").addEventListener("input", () => {
  const v = $("prev").value.trim();
  if (state && (!v || isAddr(v))) { $("prev").setAttribute("aria-invalid", "false"); syncUrl(); render(); }
});
function renderSkip() {
  const list = $("skip-list");
  list.innerHTML = "";
  for (const a of skip) {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.innerHTML = `<a href="${addrUrl(a)}" target="_blank" rel="noopener">${a}</a><button type="button" aria-label="Remove ${a}">×</button>`;
    chip.querySelector("button").onclick = () => { skip.delete(a); skipChanged(); };
    list.append(chip);
  }
}
async function skipChanged() {
  try { localStorage.setItem("skip", JSON.stringify([...skip])); } catch {}
  renderSkip();
  if (state) { state = computeAll(state.owners, await loadData()); render(); }
}
$("skip").addEventListener("submit", e => {
  e.preventDefault();
  const v = $("skip-add").value.trim();
  const ok = isAddr(v);
  $("skip-add").setAttribute("aria-invalid", String(!ok));
  if (!ok) return;
  skip.add(lc(v));
  $("skip-add").value = "";
  skipChanged();
});
$("skip-reset").onclick = () => { skip = new Set(DEFAULT_SKIP); skipChanged(); };
renderSkip();

$("view-grid").onclick = () => setView("grid");
$("view-list").onclick = () => setView("list");
setView(view);

const ownerInputs = () => [...$("owners").querySelectorAll("input")];
let ownerSeq = 0;
function addOwner(value = "", after = null) {
  const row = document.createElement("div");
  row.className = "owner-row";
  const id = `owner-${ownerSeq++}`;
  row.innerHTML = `<input id="${id}" placeholder="0x…" spellcheck="false" aria-label="Current owner"><button type="button" class="icon" aria-label="Remove owner">×</button>`;
  const input = row.querySelector("input");
  input.value = value;
  // Pasting several addresses into one field spreads them over separate fields.
  input.addEventListener("input", () => {
    const found = input.value.match(/0x[0-9a-fA-F]{40}/g) || [];
    if (found.length < 2) return;
    input.value = found[0];
    let last = row;
    for (const a of found.slice(1)) last = addOwner(a, last);
  });
  row.querySelector("button").onclick = () => {
    if (ownerInputs().length > 1) row.remove(); else input.value = "";
    if (state) run();
  };
  if (after) after.after(row); else $("owners").insertBefore(row, $("owner-add"));
  return row;
}
const addBtn = document.createElement("button");
addBtn.type = "button"; addBtn.id = "owner-add"; addBtn.className = "icon"; addBtn.textContent = "+";
addBtn.setAttribute("aria-label", "Add owner");
addBtn.style.justifySelf = "start";
addBtn.onclick = () => addOwner().querySelector("input").focus();
$("owners").append(addBtn);

const params = new URLSearchParams(location.search);
const initial = (params.get("owner") || "").split(/[\s,]+/).filter(Boolean);
for (const a of initial.length ? initial : [""]) addOwner(a);
$("prev").value = params.get("prev") || "";
if (initial.length) run();
loadData().then(d => {
  $("asof").textContent = "Data to " + new Date(d.toTime * 1000).toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
}, e => setStatus(e.message, true));
</script>
</body>
</html>
