<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kemonokaki Provenance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky query bar over a dense card grid; sender chips act as one-click filters. */
:root {
  --bg: #f6f3f7;
  --surface: #ffffff;
  --fg: #2a2430;
  --muted: #7a7084;
  --line: #e4dde8;
  --accent: #d0587e;
  --accent-ink: #ffffff;
  --mint: #2f8f78;
  --warn: #b5482f;
  --display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17141b; --surface: #221e28; --fg: #eee8f2; --muted: #a197ab; --line: #352f3d;
    --accent: #ec7aa0; --accent-ink: #1a1016; --mint: #6fd0b5; --warn: #f08a70; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17141b; --surface: #221e28; --fg: #eee8f2; --muted: #a197ab; --line: #352f3d;
  --accent: #ec7aa0; --accent-ink: #1a1016; --mint: #6fd0b5; --warn: #f08a70; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 500 15px/1.5 var(--display);
  padding-inline: 16px; padding-block: 0 48px;
}
.wrap { max-width: 1180px; margin: 0 auto; }
header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; padding-block: 28px 18px; }
h1 { margin: 0; font-weight: 900; font-size: clamp(26px, 4vw, 36px); letter-spacing: -0.01em; text-wrap: balance; }
h1 span { color: var(--accent); }
.meta { font: 400 12px/1.4 var(--mono); color: var(--muted); }
.meta a { color: inherit; }

form {
  position: sticky; top: 0; z-index: 5;
  display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end;
  background: var(--bg); padding-block: 12px; border-bottom: 1px solid var(--line);
}
label { display: grid; gap: 4px; min-width: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
input {
  width: 100%; min-width: 0; font: 400 14px var(--mono); color: var(--fg);
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
}
input:focus-visible, button:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[aria-invalid="true"] { border-color: var(--warn); }
button {
  font: 700 14px var(--display); cursor: pointer; border: 0; border-radius: 10px;
  padding: 11px 20px; background: var(--accent); color: var(--accent-ink);
}
button:disabled { opacity: 0.55; cursor: progress; }
@media (max-width: 720px) { form { grid-template-columns: 1fr; } }

.status { min-height: 22px; padding-block: 14px 4px; font: 400 13px var(--mono); color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap; }
.status strong { color: var(--fg); font-weight: 500; }
.status .err { color: var(--warn); }

.senders { display: flex; flex-wrap: wrap; gap: 6px; padding-block: 6px 16px; }
.chip {
  font: 400 12px var(--mono); color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; cursor: pointer;
  font-variant-numeric: tabular-nums;
}
.chip b { color: var(--accent); font-weight: 500; margin-left: 6px; }
.chip[aria-pressed="true"] { border-color: var(--accent); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
@media (max-width: 440px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.card .img { aspect-ratio: 1; max-width: 100%; background: var(--line); }
.card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .body { padding: 10px 12px 12px; display: grid; gap: 6px; min-width: 0; }
.card .name { font-weight: 900; font-size: 16px; display: flex; justify-content: space-between; gap: 8px; }
.card .name a { color: inherit; text-decoration: none; }
.card .name a:hover { color: var(--accent); }
.row { display: grid; gap: 1px; min-width: 0; }
.row .k { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.row .v { font: 400 12px var(--mono); overflow-wrap: anywhere; }
.row .v a { color: var(--fg); }
.row .v a:hover { color: var(--accent); }
.mint { color: var(--mint); }
.empty { padding-block: 40px; text-align: center; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .card { transition: transform .15s; } .card:hover { transform: translateY(-2px); } }

.bar { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.bar .status { flex: 1 1 auto; min-width: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-block: 12px 0; }
.seg button { background: var(--surface); color: var(--muted); border-radius: 0; padding: 6px 14px; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
table { width: 100%; border-collapse: collapse; font: 400 13px var(--mono); font-variant-numeric: tabular-nums; }
th { text-align: left; font: 700 10px var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 6px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td a { color: var(--fg); }
td a:hover { color: var(--accent); }
td.thumb { width: 52px; padding-right: 0; }
td.thumb img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; display: block; background: var(--line); }
td.id { font-weight: 500; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Kemono<span>kaki</span> Provenance</h1>
    <div class="meta">Base · <a href="https://basescan.org/token/0xee7d1b184be8185adc7052635329152a4d0cdefa" target="_blank" rel="noopener">0xee7d…defa</a></div>
  </header>

  <form id="q" autocomplete="off">
    <label for="owner">Current owner
      <input id="owner" name="owner" placeholder="0x…" spellcheck="false" required>
    </label>
    <label for="prev">Previous owner
      <input id="prev" name="prev" placeholder="0x… (optional)" spellcheck="false">
    </label>
    <button id="go" type="submit">Look up</button>
  </form>

  <div class="bar">
    <div class="status" id="status"></div>
    <div class="seg" role="group" aria-label="View">
      <button type="button" id="view-grid" aria-pressed="true">Grid</button>
      <button type="button" id="view-list" aria-pressed="false">List</button>
    </div>
  </div>
  <div class="senders" id="senders"></div>
  <div id="results"></div>
</div>

<script>
const API = "https://base.blockscout.com/api/v2";
const CONTRACT = "0xee7d1b184be8185adc7052635329152a4d0cdefa";
const ZERO = "0x0000000000000000000000000000000000000000";
const GATEWAYS = ["https://ipfs.io/ipfs/", "https://gateway.pinata.cloud/ipfs/", "https://dweb.link/ipfs/"];
const isAddr = s => /^0x[0-9a-fA-F]{40}$/.test(s);
const short = a => a.slice(0, 6) + "…" + a.slice(-4);
const lc = s => (s || "").toLowerCase();
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const nftUrl = id => `https://basescan.org/nft/${CONTRACT}/${id}`;
const addrUrl = a => `https://basescan.org/address/${a}`;

let state = null; // { owner, tokens: [{id, name, from, via, time, tx}] }
let runId = 0;
let view = "grid";
try { if (localStorage.getItem("view") === "list") view = "list"; } catch {}

const RPC = "https://mainnet.base.org";
const IMAGE_CID = "bafybeidxclt74frtmiuiisfquphn2qdukz2cg63cr7bwyblp3mfwr5gk6a";

// Blockscout's anonymous limit is per IP; keep requests spaced and back off on 429.
let lastReq = 0;
async function getJSON(url, init) {
  for (let i = 0; i < 6; i++) {
    const wait = lastReq + 250 - Date.now();
    lastReq = Math.max(Date.now(), lastReq + 250);
    if (wait > 0) await sleep(wait);
    const r = await fetch(url, init);
    if (r.ok) return r.json();
    if (r.status === 429 || r.status >= 500) { await sleep(1500 * 2 ** i); continue; }
    throw new Error(`${new URL(url).host} returned ${r.status}`);
  }
  throw new Error("Too many requests to Blockscout. Try again in a few minutes.");
}

// Every transfer of this collection into or out of addr, newest first. Cached per address.
const histCache = new Map();
function transfersOf(addr) {
  const k = lc(addr);
  if (!histCache.has(k)) {
    histCache.set(k, (async () => {
      const rows = [];
      for (let page = 1; ; page++) {
        const q = new URLSearchParams({ module: "account", action: "tokennfttx", contractaddress: CONTRACT, address: addr, page, offset: 10000, sort: "desc" });
        const d = await getJSON(`https://base.blockscout.com/api?${q}`);
        const res = Array.isArray(d.result) ? d.result : [];
        if (d.status !== "1" && !/no token transfers/i.test(d.message || "")) throw new Error(`Blockscout: ${d.message || "bad response"}`);
        for (const r of res) rows.push({ id: r.tokenID, from: lc(r.from), to: lc(r.to), hash: r.hash, block: +r.blockNumber, txi: +r.transactionIndex, time: +r.timeStamp });
        if (res.length < 10000) break;
      }
      return rows;
    })().catch(e => { histCache.delete(k); throw e; }));
  }
  return histCache.get(k);
}

// Address kind from bytecode: "eoa", "7702" (delegated user wallet) or "contract". Cached.
const kindCache = new Map();
async function classify(addrs) {
  const todo = [...new Set(addrs.map(lc))].filter(a => !kindCache.has(a));
  for (let i = 0; i < todo.length; i += 10) {
    const chunk = todo.slice(i, i + 10);
    const body = chunk.map((a, j) => ({ jsonrpc: "2.0", id: j, method: "eth_getCode", params: [a, "latest"] }));
    const res = await getJSON(RPC, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
    if (!Array.isArray(res)) throw new Error(`Base RPC: ${res?.error?.message || "bad response"}`);
    for (const r of res) {
      const code = r.result || "0x";
      kindCache.set(chunk[r.id], code === "0x" ? "eoa" : code.startsWith("0xef0100") ? "7702" : "contract");
    }
  }
}
const isContract = a => kindCache.get(a) === "contract";

// Most recent transfer of token tid into addr that happened before ref.
function priorIn(rows, addr, tid, ref) {
  return rows.find(r => r.id === tid && r.to === addr && r !== ref &&
    (r.block < ref.block || (r.block === ref.block && r.txi <= ref.txi)) &&
    !(r.hash === ref.hash && r.from === ref.from && r.to === ref.to));
}

async function load(owner) {
  const id = ++runId;
  const me = lc(owner);
  const live = () => id === runId;
  setStatus("Loading transfers…");
  const mine = await transfersOf(owner);
  if (!live()) return null;

  // The newest transfer per token decides whether the owner still holds it.
  const seen = new Set();
  const tokens = [];
  for (const r of mine) {
    if (seen.has(r.id)) continue;
    seen.add(r.id);
    if (r.to !== me) continue;
    tokens.push({ id: r.id, name: `Kemonokaki #${r.id}`, from: null, via: [], time: r.time, tx: r.hash, _cur: r.from, _ref: r });
  }

  // Walk each token back past contracts (and the owner's own earlier hops) to the wallet that sent it.
  for (let round = 0; round < 8; round++) {
    await classify(tokens.map(t => t._cur));
    if (!live()) return null;
    const waiting = tokens.filter(t => !t._stuck && (isContract(t._cur) || t._cur === me));
    if (!waiting.length) break;
    const addrs = [...new Set(waiting.map(t => t._cur))];
    for (const [i, a] of addrs.entries()) {
      setStatus(`Tracing past contracts… ${i + 1}/${addrs.length}`);
      const rows = await transfersOf(a);
      if (!live()) return null;
      for (const t of waiting.filter(t => t._cur === a)) {
        const prev = priorIn(rows, a, t.id, t._ref);
        if (!prev) { t._stuck = true; continue; }
        if (isContract(a)) t.via.push(a);
        t._cur = prev.from;
        t._ref = prev;
      }
    }
  }

  for (const t of tokens) { t.from = t._cur; delete t._cur; delete t._ref; delete t._stuck; }
  tokens.sort((a, b) => b.time - a.time || Number(a.id) - Number(b.id));
  return { owner, tokens };
}

function setStatus(html, isErr) {
  $("status").innerHTML = isErr ? `<span class="err">${html}</span>` : html;
}

function imgSrcs(t) {
  return [".png", ".gif"].flatMap(ext => GATEWAYS.map(g => `${g}${IMAGE_CID}/${t.id}${ext}`));
}
function attachImg(img, t) {
  const srcs = imgSrcs(t);
  let i = 0;
  img.onerror = () => { if (++i < srcs.length) img.src = srcs[i]; };
  if (srcs.length) img.src = srcs[0];
}

const fromHtml = t => !t.from ? `<span>unknown</span>`
  : t.from === ZERO ? `<span class="mint">Minted</span>`
  : `<a href="${addrUrl(t.from)}" target="_blank" rel="noopener" title="${t.from}">${short(t.from)}</a>`;
const viaHtml = t => t.via.map(a => `<a href="${addrUrl(a)}" target="_blank" rel="noopener" title="${a}">${short(a)}</a>`).join(" · ");
const whenHtml = t => {
  const when = t.time ? new Date(t.time * 1000).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) : "—";
  return t.tx ? `<a href="https://basescan.org/tx/${t.tx}" target="_blank" rel="noopener">${when}</a>` : when;
};

function renderGrid(shown) {
  const grid = document.createElement("div");
  grid.className = "grid";
  for (const t of shown) {
    const card = document.createElement("article");
    card.className = "card";
    card.innerHTML = `
      <div class="img"><img loading="lazy" alt="${t.name}"></div>
      <div class="body">
        <div class="name"><a href="${nftUrl(t.id)}" target="_blank" rel="noopener">#${t.id}</a></div>
        <div class="row"><span class="k">Previous owner</span><span class="v">${fromHtml(t)}</span></div>
        ${t.via.length ? `<div class="row"><span class="k">Via contract</span><span class="v">${viaHtml(t)}</span></div>` : ""}
        <div class="row"><span class="k">Received</span><span class="v">${whenHtml(t)}</span></div>
      </div>`;
    attachImg(card.querySelector("img"), t);
    grid.append(card);
  }
  return grid;
}

function renderList(shown) {
  const wrap = document.createElement("div");
  wrap.className = "table-wrap";
  wrap.innerHTML = `<table><thead><tr><th></th><th>Token</th><th>Previous owner</th><th>Via contract</th><th>Received</th><th>BaseScan</th></tr></thead><tbody></tbody></table>`;
  const body = wrap.querySelector("tbody");
  for (const t of shown) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="thumb"><img loading="lazy" alt="${t.name}"></td>
      <td class="id">#${t.id}</td>
      <td>${fromHtml(t)}</td>
      <td>${viaHtml(t) || "—"}</td>
      <td>${whenHtml(t)}</td>
      <td><a href="${nftUrl(t.id)}" target="_blank" rel="noopener">View NFT</a></td>`;
    attachImg(tr.querySelector("img"), t);
    body.append(tr);
  }
  return wrap;
}

function render() {
  const results = $("results"), senders = $("senders");
  results.innerHTML = ""; senders.innerHTML = "";
  if (!state) return;
  const prev = lc($("prev").value.trim());
  const shown = prev ? state.tokens.filter(t => lc(t.from) === prev) : state.tokens;

  const counts = new Map();
  for (const t of state.tokens) {
    if (!t.from) continue;
    const c = counts.get(t.from) || { n: 0 };
    c.n++; counts.set(t.from, c);
  }
  [...counts.entries()].sort((a, b) => b[1].n - a[1].n).slice(0, 40).forEach(([addr, c]) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip";
    b.setAttribute("aria-pressed", String(lc(addr) === prev));
    b.innerHTML = `${addr === ZERO ? "Minted" : short(addr)}<b>${c.n}</b>`;
    b.title = addr;
    b.onclick = () => {
      $("prev").value = lc(addr) === prev ? "" : addr;
      syncUrl(); render();
    };
    senders.append(b);
  });

  setStatus(`<strong>${shown.length}</strong>&nbsp;shown · ${state.tokens.length} held by ${short(state.owner)} · ${counts.size} previous owner${counts.size === 1 ? "" : "s"}`);
  if (!shown.length) { results.innerHTML = `<div class="empty">No matches</div>`; return; }
  results.append(view === "list" ? renderList(shown) : renderGrid(shown));
}

function setView(v) {
  view = v;
  $("view-grid").setAttribute("aria-pressed", String(v === "grid"));
  $("view-list").setAttribute("aria-pressed", String(v === "list"));
  try { localStorage.setItem("view", v); } catch {}
  render();
}

function syncUrl() {
  const p = new URLSearchParams();
  const o = $("owner").value.trim(), v = $("prev").value.trim();
  if (o) p.set("owner", o);
  if (v) p.set("prev", v);
  history.replaceState(null, "", p.toString() ? `?${p}` : location.pathname);
}

async function run() {
  const owner = $("owner").value.trim();
  const prev = $("prev").value.trim();
  $("owner").setAttribute("aria-invalid", String(!isAddr(owner)));
  $("prev").setAttribute("aria-invalid", String(!!prev && !isAddr(prev)));
  if (!isAddr(owner)) return setStatus("Current owner must be a 0x address (42 characters).", true);
  if (prev && !isAddr(prev)) return setStatus("Previous owner must be a 0x address (42 characters).", true);
  syncUrl();

  if (state && lc(state.owner) === lc(owner)) return render();
  state = null; render();
  $("go").disabled = true;
  try {
    const s = await load(owner);
    if (s) { state = s; render(); }
  } catch (e) {
    setStatus(`${e.message}`, true);
  } finally {
    $("go").disabled = false;
  }
}

$("q").addEventListener("submit", e => { e.preventDefault(); run(); });
$("prev").addEventListener("input", () => {
  const v = $("prev").value.trim();
  if (state && (!v || isAddr(v))) { $("prev").setAttribute("aria-invalid", "false"); syncUrl(); render(); }
});
$("view-grid").onclick = () => setView("grid");
$("view-list").onclick = () => setView("list");
setView(view);

const params = new URLSearchParams(location.search);
$("owner").value = params.get("owner") || "";
$("prev").value = params.get("prev") || "";
if ($("owner").value) run();
</script>
</body>
</html>
